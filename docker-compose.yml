services:
  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    

  server1:
    build: ./base-llm-backend
    env_file:
      - ./base-llm-backend/.env
    environment:    
      - SERVER_NAME=pehla server
    ports:
      - "5001:3008"

  server2:
    build: ./base-llm-backend
    env_file:
      - ./base-llm-backend/.env
    environment:  
      - SERVER_NAME=dusra server
    ports:
      - "5002:3008"

  server3:
    build: ./base-llm-backend
    env_file:
      - ./base-llm-backend/.env
    environment:
      - SERVER_NAME=teesra server
    ports:
      - "5003:3008"
